name: Desplegar evaluar-alerta (Supabase)

# Despliega la Edge Function evaluar-alerta a producción cada vez que cambia su código
# en main, así no hay que pegar archivos a mano en el editor de Supabase.
#
# Seguridad:
#  - Antes de desplegar corre los tests de la función; si fallan, NO se despliega.
#  - Mantiene la configuración actual de la función: hoy NO exige token de entrada
#    (la llaman pg_cron y las funciones de ingesta sin autorización), por eso lleva
#    --no-verify-jwt. Sin ese flag el cron de cada 5 minutos dejaría de funcionar.
#  - La clave de Supabase vive solo en el secreto SUPABASE_ACCESS_TOKEN de GitHub.
#
# Uso manual: pestaña Actions > "Desplegar evaluar-alerta (Supabase)" > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/evaluar-alerta/**"
      - ".github/workflows/deploy-evaluar-alerta.yml"
  workflow_dispatch:

concurrency:
  group: deploy-evaluar-alerta
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que existe el secreto de Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (GitHub > Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests de la función (si fallan, no se despliega)
        env:
          TZ: America/Argentina/Buenos_Aires
        run: >
          node --experimental-strip-types --test
          supabase/functions/evaluar-alerta/logica.test.ts
          supabase/functions/evaluar-alerta/pronostico_banner.test.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Chequeo previo: si la clave puede listar proyectos, tiene que ver el de Baliza (si no, es
      # de otra cuenta). Una clave de alcance limitado (lo más seguro) puede no poder listar:
      # en ese caso solo avisa y deja que el deploy decida. No se imprime la lista de proyectos
      # (los logs de un repo público los puede leer cualquiera).
      - name: Verificar que la clave ve el proyecto de Baliza
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          supabase projects list > proyectos.log 2>&1
          estado=$?
          if [ $estado -ne 0 ]; then
            detalle=$(tail -c 800 proyectos.log | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::warning title=No se pudo listar proyectos (normal con una clave de alcance limitado)::$detalle"
          elif ! grep -q "tcgzpcfhwytrrhfxtkmt" proyectos.log; then
            echo "::error title=La clave no ve el proyecto de Baliza::La clave funciona pero fue creada con OTRA cuenta de Supabase. Generala con la cuenta dueña de Baliza (supabase.com/dashboard/account/tokens) y reemplazá el secreto SUPABASE_ACCESS_TOKEN en GitHub."
            exit 1
          fi

      # Si el deploy falla, deja el motivo en una anotación del run (visible sin iniciar sesión).
      - name: Desplegar evaluar-alerta
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set +e
          supabase functions deploy evaluar-alerta --project-ref tcgzpcfhwytrrhfxtkmt --no-verify-jwt > deploy.log 2>&1
          estado=$?
          cat deploy.log
          if [ $estado -ne 0 ]; then
            detalle=$(tail -c 1500 deploy.log | tr '\r\n' '  ' | sed 's/%/%25/g')
            echo "::error title=Falló el deploy de evaluar-alerta::$detalle"
            exit 1
          fi
