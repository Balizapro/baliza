name: Ingesta de datos (backup)

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Ingesta (las 8 fuentes)
        run: |
          curl -s -f -X GET "https://baliza-ashy.vercel.app/api/cron/ingest-all" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
